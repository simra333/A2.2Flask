apiVersion: apps/v1
kind: Deployment 
metadata:
  name: pythonapp-deployment
  labels:
    app: pythonapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pythonapp
  template:
    metadata:
      labels:
        app: pythonapp
    spec:
      containers:
      - name: pythonapp
        image: simraabid/pythonapp:latest
        ports:
        - containerPort: 5000
        imagePullPolicy: Always
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: pythonapp-service
spec:
  type: LoadBalancer
  selector:
    app: pythonapp
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000